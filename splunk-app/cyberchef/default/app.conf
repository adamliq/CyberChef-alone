#
# Splunk app wrapper for CyberChef (https://github.com/gchq/CyberChef).
# Ships the fully self-contained, offline standalone build as a static
# asset and adds one navigation entry to open it. No search-time (SPL)
# integration - this is a UI tool only.
#

[install]
is_configured = false
state = enabled

[ui]
is_visible = true
label = CyberChef

[launcher]
version = 11.6.0
description = The Cyber Swiss Army Knife - an offline, fully self-contained toolkit for encoding, decoding, encryption, compression and data analysis. Runs entirely in your browser; no data is sent anywhere.

[id]
name = cyberchef
version = 11.6.0

[package]
id = cyberchef
check_for_updates = false
